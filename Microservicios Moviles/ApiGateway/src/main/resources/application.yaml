server:
  port: 9090

spring:
  application:
    name: ApiGateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          "[/**]":
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: usuario-service
          uri: http://usuario-service:8081
          predicates:
            - Path=/usuarios/**
        - id: donaciones-service
          uri: http://donaciones-service:8082
          predicates:
            - Path=/donaciones/**
        - id: contacto-service
          uri: http://contacto-service:8083
          predicates:
            - Path=/contacto/**

management:
  endpoints:
    web:
      exposure:
        include: health
