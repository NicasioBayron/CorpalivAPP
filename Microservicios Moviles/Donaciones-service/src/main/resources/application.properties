server.port=8082
spring.application.name=Donaciones-service
# ==========================================
# 1. Conexión a MySQL
# ==========================================
# El parámetro ?createDatabaseIfNotExist=true creará la BD si aún no existe
spring.datasource.url=jdbc:mysql://localhost:3306/corpaliv_donaciones_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# 2. Configuración de Liquibase
# ==========================================
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-donaciones.sql

# ==========================================
# 3. Importante para Hibernate / JPA
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
